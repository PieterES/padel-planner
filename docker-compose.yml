services:
  web:
    build: .
    image: padel-planner
    env_file: .env
    environment:
      WORKER_URL: http://worker:4000
    volumes:
      - ./data:/app/data
    # Reachable on the Pi's LAN address too (like the owner's other apps), so the
    # Cloudflare Tunnel can use http://<pi-ip>:<WEB_PORT> or http://localhost:<WEB_PORT>.
    # Default 3010 (3000 is taken on the Pi).
    ports:
      - "${WEB_PORT:-3010}:3000"
    depends_on: [worker]
    restart: unless-stopped

  worker:
    image: padel-planner
    command: ["npx", "tsx", "worker/index.ts"]
    env_file: .env
    volumes:
      - ./data:/app/data
    # No published ports: only `web` talks to it over the compose network.
    restart: unless-stopped

  # Optional: run the tunnel in compose instead of on the host.
  #   docker compose --profile tunnel up -d   (needs TUNNEL_TOKEN in .env)
  # In the Cloudflare dashboard, point the public hostname to http://web:3000.
  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [web]
    restart: unless-stopped
    profiles: [tunnel]
